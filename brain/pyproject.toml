[project]
name = "kavach-brain"
version = "0.1.0"
description = "KAVACH Brain layer — kill switch, voice loop, reasoning router"
# Floor is numpy 2.5 (>=3.12); ceiling is kokoro-onnx (<3.14).
requires-python = ">=3.12,<3.14"
dependencies = [
    # Global hotkey + menubar panic item. pyobjc over pynput/rumps:
    # rumps' last release was 2022-10, and pynput silently drops ctrl/alt
    # hotkeys on macOS (moses-palmer/pynput#297) — disqualifying for a
    # kill switch. Both pyobjc frameworks were updated 2026-08-11.
    "pyobjc-framework-Cocoa>=12.2.2",
    "pyobjc-framework-Quartz>=12.2.2",
    # ——— Phase 2: local voice loop ———
    "numpy>=2.5.2",
    "sounddevice>=0.5.5",         # mic capture (PortAudio)
    "pywhispercpp>=1.5.0",        # whisper.cpp + Metal; prebuilt arm64 wheels,
    # so no cmake and no building from source
    "kokoro-onnx>=0.5.0",         # TTS; bundles espeak via espeakng-loader
    "websockets>=17.0.1",         # bridge to the orb (Presence layer)
    # Wake word. Porcupine is gone — Picovoice killed the free tier on
    # 2026-06-30 with no non-commercial replacement.
    "livekit-wakeword>=0.2.1",
    # ↓ Undeclared dependencies of livekit-wakeword 0.2.1: its CLI imports all
    #   three but the package requires none of them, so `livekit-wakeword`
    #   fails with ModuleNotFoundError out of the box. Pinned here explicitly
    #   rather than left to chance. Remove once upstream declares them.
    "typer>=0.27.1",
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "claude-agent-sdk>=0.2.137",

    # ——— Phase 6: speaker verification ———
    # Resemblyzer is from 2023 and its dependency list is actively harmful on
    # Python 3.12: it pulls a `typing` BACKPORT that shadows the stdlib module,
    # and a `webrtcvad` whose import crashes on `pkg_resources`. Both are
    # neutralised in [tool.uv] below; webrtcvad-wheels supplies the module.
    "resemblyzer>=0.1.4",
    "librosa>=0.9.1",   # floor is resemblyzer's; audiomentations caps <1.0
    "torch>=2.13.0",             # resemblyzer's encoder — RUNTIME, not
                                 # just training. It was in the training
                                 # group, so `uv sync` without that group
                                 # silently broke speaker verification.
    "webrtcvad-wheels>=2.0.14",  # supplies the `webrtcvad` module that
                                 # resemblyzer imports; the original has
                                 # no py3.12 wheel and dies on pkg_resources   # floor is resemblyzer's; audiomentations caps it below 1.0
]

[tool.uv]
# Neutralise two dependencies of resemblyzer rather than vendoring it.
# The markers never match on the Python versions this project supports, so
# neither package is installed, and `uv sync` reproduces this exactly.
override-dependencies = [
    "typing; python_version < '3.0'",     # backport shadows stdlib typing
    "webrtcvad; python_version < '3.0'",  # crashes on pkg_resources; we use
                                          # webrtcvad-wheels instead
]

# Phase 3 deps are deliberately absent until their phase:
#   claude-agent-sdk, ollama

[project.scripts]
kavach = "kavach.killswitch.cli:main"
kavach-enrol = "kavach.identity.enrol:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
]
# Only needed to TRAIN a custom wake word, not to run one. Kept out of the
# default install so the runtime stays light: torch alone dwarfs everything
# else in this project.
#   uv sync --group wakeword-training
wakeword-training = [
    "audiomentations>=0.43.1",
    "onnx>=1.22.0",
    # More undeclared livekit-wakeword deps. An AST scan of the package found
    # 7 third-party imports it never declares; these 4 are the ones the
    # piper_vits path actually reaches. The others are for paths we don't use:
    # matplotlib (eval plots), huggingface_hub (voxcpm backend), pyaudio (its
    # own listener — we use sounddevice).
    # torchaudio's numbering lags torch (2.11 is latest against torch 2.13).
    # It declares no torch pin of its own, so this is a version skew we accept
    # rather than downgrading torch.
    "torchaudio>=2.11.0",   # Piper VITS synthesis
    "nltk>=3.9",            # phrase normalisation
    "pronouncing>=0.2.0",   # CMUdict phonemes for the target phrase
    "onnxscript>=0.6.2",    # ONNX export — declared only in their "export"
                            # extra, so `run` fails at step 5/6 without it
                            # AFTER an hour of training has completed
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kavach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
