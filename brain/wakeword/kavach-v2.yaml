# Custom "KAVACH" wake word, take 2 — accent-diverse synthesis.
#
# WHY THIS EXISTS
#
# v1 (kavach.yaml) trained on piper `en-us-libritts-high` only, and scored
# recall 0.982 / FPPH 0.00 on its held-out set. Those numbers were real and
# meaningless: the test clips came from the same generator as the training
# clips, so they measured memorisation of one American-English TTS, not
# recognition of the word.
#
# Measured against the actual user's voice (`kavach-waketune`):
#
#     KAVACH, 5 real takes   0.027  0.335  0.207  0.486  0.571
#     "what time is it"      0.789   ← outscored every real wake-word take
#
# No threshold separates those, so the wake word was unusable. The gap is
# accent: LibriTTS is American English read speech, and the user speaks
# Indian-accented English saying a Sanskrit word.
#
# Fix: swap piper for VoxCPM2, whose voices are described in natural language,
# and describe voices that span the space the real speaker lives in.
#
# Train:  uv run livekit-wakeword run wakeword/kavach-v2.yaml
# Verify: uv run kavach-waketune     ← the only test that counts

model_name: kavach_v2

target_phrases:
  - "kavach"
  - "hey kavach"
  - "kuvach"
  - "kavatch"

custom_negative_phrases:
  - "cover"
  - "kayak"
  - "catch"
  - "the coverage"
  - "have a"
  - "car wash"
  - "cabbage"
  - "package"
  # Phrases the real user actually says to it. "what time is it" scored 0.789
  # against v1 — higher than any true positive — so it is now an explicit
  # negative rather than something we hope the model figures out.
  - "what time is it"
  - "open my calendar for tomorrow"
  - "delete the draft in notes"
  - "what is on my screen"
  - "search my files for"

tts_backend: voxcpm

voxcpm_tts:
  # Weighted toward South Asian English, because that is the voice that has to
  # work. The rest are kept so the model does not simply swap one narrow
  # accent for another — it should recognise the word, not a demographic.
  voice_design_prompts:
    # — South Asian English —
    - "A young adult Indian man speaking English with a North Indian accent, clear mid-pitch, moderate pace"
    - "A young adult Indian man, Hindi-influenced English, warm baritone, natural conversational pace"
    - "A young adult Indian woman speaking English with an Indian accent, clear voice, moderate pace"
    - "A middle-aged Indian man, Indian English accent, deep voice, measured pace"
    - "A young Indian man speaking English quickly and casually, slightly clipped consonants"
    - "An Indian man speaking English with a South Indian accent, mid pitch, articulate"
    - "A young adult Pakistani man speaking English, clear diction, moderate pace"
    - "An Indian woman speaking English with a Mumbai accent, bright voice, quick pace"
    - "A young Indian man speaking softly and close to the microphone, relaxed tone"
    - "An Indian man speaking English with emphasis on the first syllable, firm delivery"
    # — Sanskrit / Hindi phonetics, since the word is Sanskrit —
    - "A Hindi speaker pronouncing a Sanskrit word, precise retroflex consonants, even pace"
    - "An Indian man pronouncing a Sanskrit term with traditional pronunciation, deliberate"
    # — Other accents, so the model generalises rather than narrowing —
    - "A young adult woman, clear mid-pitch voice, moderate pace, calm and professional"
    - "A young adult man, warm baritone, steady pace, friendly and articulate"
    - "A middle-aged man, British English accent, deep resonant voice"
    - "A young adult woman, Australian English accent, bright tone, quick pace"
    - "An older adult man, American English, gravelly tenor, matter-of-fact"
    - "A young man speaking English with a slight East Asian accent, even pace"
    # — Realistic delivery conditions, not just realistic voices —
    - "A person speaking from across a room, slightly distant and quiet"
    - "A person speaking quickly and a little slurred, casual and unhurried"
    - "A person half-whispering, low energy, close to the microphone"
    - "A person calling out slightly louder than normal, raised voice"

data_dir: ./wakeword/data
output_dir: ./wakeword/output

# VoxCPM is far slower per clip than piper — piper managed ~9 clips/s, and a
# neural TTS will not come close. n_samples is therefore set from a measured
# rate rather than copied from v1's 10000. See `bench_voxcpm.py`.
n_samples: 3000
n_samples_val: 600
n_background_samples: 200
n_background_samples_val: 40

steps: 50000
target_fp_per_hour: 0.2
